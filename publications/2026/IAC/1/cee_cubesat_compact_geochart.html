<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CEE CubeSat Portfolio Map</title>
  <style>
    :root{--bg:#071724;--border:#2d5975;--text:#eaf8ff;--muted:#a9c5d7;--hu:#45d39a;--sk:#918dff;--cz:#ff9878;--hr:#65baff}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{color:var(--text)}
    .widget{position:relative;width:100%;height:100%;min-width:0;min-height:0;overflow:hidden;border:1px solid var(--border);border-radius:14px;background:radial-gradient(circle at 82% 5%,rgba(42,147,178,.22),transparent 36%),linear-gradient(135deg,#0c253a,#071724)}
    .header{position:absolute;z-index:3;top:0;left:0;right:0;height:45px;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid rgba(100,162,192,.25);background:rgba(7,23,36,.78);backdrop-filter:blur(6px)}
    .title{min-width:0}.eyebrow{display:block;color:#68e1d3;font-size:8px;line-height:1;text-transform:uppercase;font-weight:800;letter-spacing:.13em}.headline{display:block;margin-top:4px;color:var(--text);font-size:12px;line-height:1;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hint{color:var(--muted);font-size:9px;white-space:nowrap;margin-left:8px}
    #chart{position:absolute;top:45px;bottom:0;left:0;right:0;background:#dce6ec}.legend{position:absolute;z-index:3;left:10px;bottom:8px;display:flex;align-items:center;gap:8px;padding:5px 7px;border:1px solid rgba(76,123,151,.52);border-radius:8px;background:rgba(7,23,36,.82);font-size:8px;color:#d9eaf5;box-shadow:0 3px 15px rgba(0,0,0,.22)}.key{display:flex;align-items:center;gap:3px}.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
    .popup{position:absolute;z-index:8;display:none;left:50%;top:52%;width:min(286px,calc(100% - 24px));transform:translate(-50%,-50%) scale(.96);opacity:0;padding:12px 13px 10px;border:1px solid rgba(119,212,230,.7);border-radius:11px;background:rgba(7,25,40,.96);box-shadow:0 16px 35px rgba(0,0,0,.48);transition:opacity .16s ease,transform .16s ease}.popup.show{display:block;opacity:1;transform:translate(-50%,-50%) scale(1)}.popup-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.popup h2{margin:0;font-size:15px;line-height:1.1}.popup .count{margin:4px 0 9px;color:#8ddfd6;font-size:10px;font-weight:700}.close{display:grid;place-items:center;width:21px;height:21px;padding:0;border:1px solid #496f89;border-radius:50%;background:#153650;color:#effaff;font-size:16px;line-height:1;cursor:pointer}.missions{display:flex;flex-wrap:wrap;gap:5px;max-height:105px;overflow:auto;padding-right:2px}.mission{border:1px solid rgba(121,183,211,.45);border-radius:999px;background:#123651;color:#edf9ff;padding:4px 6px;font-size:9px;line-height:1.1;white-space:nowrap}.note{margin:9px 0 0;color:#a9c5d7;font-size:9px;line-height:1.32}.google-visualization-tooltip{display:none!important}
    @media(max-width:380px){.hint{display:none}.legend{gap:5px;left:7px;bottom:6px}.popup{top:55%}.missions{max-height:88px}}
  </style>
</head>
<body>
  <div class="widget">
    <div class="header"><div class="title"><span class="eyebrow">Portfolio overview</span><span class="headline">CEE CubeSat & PocketQube Missions</span></div><span class="hint">Click a highlighted country</span></div>
    <div id="chart" aria-label="Map of focal CEE CubeSat ecosystems"></div>
    <div class="legend"><span class="key"><i class="dot" style="background:var(--hu)"></i>HU</span><span class="key"><i class="dot" style="background:var(--sk)"></i>SK</span><span class="key"><i class="dot" style="background:var(--cz)"></i>CZ</span><span class="key"><i class="dot" style="background:var(--hr)"></i>HR</span></div>
    <div class="popup" id="popup" role="dialog" aria-live="polite"><div class="popup-top"><div><h2 id="popup-title">Country</h2><div class="count" id="popup-count"></div></div><button class="close" id="close" aria-label="Close">×</button></div><div class="missions" id="mission-list"></div><p class="note">Anchor missions in the study portfolio. Several missions also involve partners across the CEE region and beyond.</p></div>
  </div>
<script src="https://www.gstatic.com/charts/loader.js"></script>
<script>
const portfolios={
  Hungary:['MASAT-1','MRC-100','SMOG-1','SMOG-P','ATL-1','HUNITY / NMHH-1','RadCube','VIREO','WREN-1','Mauve','WISDOM-A/B','RAVEN','OPS-SAT ORIOLE'],
  Slovakia:['skCube','GRBAlpha','GRBBeta'],
  Czechia:['VZLUSAT-1','VZLUSAT-2','BDSAT-1','BDSAT-2'],
  Croatia:['CroCube']
};
const countryByCode={HU:'Hungary',SK:'Slovakia',CZ:'Czechia',HR:'Croatia'};
const countryColors={Hungary:'#45d39a',Slovakia:'#918dff',Czechia:'#ff9878',Croatia:'#65baff'};
let chart,dataTable;
const popup=document.getElementById('popup');
const popupTitle=document.getElementById('popup-title');
const popupCount=document.getElementById('popup-count');
const missionList=document.getElementById('mission-list');
function openPortfolio(country){const items=portfolios[country]||[];popupTitle.textContent=country;popupTitle.style.color=countryColors[country];popupCount.textContent=items.length+' anchor mission'+(items.length===1?'':'s');missionList.innerHTML=items.map(function(name){return '<span class="mission">'+name.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</span>';}).join('');popup.classList.add('show');}
function closePortfolio(){popup.classList.remove('show');if(chart)chart.setSelection([]);}
document.getElementById('close').addEventListener('click',closePortfolio);
function draw(){if(!window.google||!google.visualization)return;dataTable=google.visualization.arrayToDataTable([['Country','Portfolio','Count'],['HU','Hungary',13],['SK','Slovakia',3],['CZ','Czechia',4],['HR','Croatia',1]]);chart=new google.visualization.GeoChart(document.getElementById('chart'));const options={region:'150',resolution:'countries',displayMode:'regions',backgroundColor:'#dce6ec',datalessRegionColor:'#cfd9df',defaultColor:'#cfd9df',legend:'none',keepAspectRatio:true,enableRegionInteractivity:true,tooltip:{trigger:'none'},colorAxis:{colors:['#dce8e9','#45d39a','#918dff','#ff9878','#65baff']}};google.visualization.events.addListener(chart,'select',function(){const sel=chart.getSelection();if(!sel.length)return;const row=sel[0].row;if(row===null)return;const code=dataTable.getValue(row,0);const country=countryByCode[code];if(country)openPortfolio(country);});chart.draw(dataTable,options);}
google.charts.load('current',{packages:['geochart']});google.charts.setOnLoadCallback(draw);window.addEventListener('resize',draw);
</script>
</body>
</html>
