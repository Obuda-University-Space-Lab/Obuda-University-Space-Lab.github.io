<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mission Return Evidence Radar</title>
  <style>
    :root{--bg:#071724;--panel:#0d2a40;--line:#2d5d79;--text:#eefaff;--muted:#aac8d9;--aqua:#4be0d0;--green:#4bd59b;--amber:#f7c85f;--violet:#9b8cff;--blue:#63baff;--red:#ff7e7e}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
    .widget{position:relative;width:100%;height:100%;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:radial-gradient(circle at 86% 2%,rgba(50,157,187,.25),transparent 38%),linear-gradient(135deg,#0c273d,#071724)}
    .header{height:48px;display:flex;justify-content:space-between;align-items:center;gap:7px;padding:7px 9px;border-bottom:1px solid rgba(109,176,203,.24);background:rgba(7,23,36,.78)}.eyebrow{display:block;color:#71e7d9;font-size:7px;font-weight:850;text-transform:uppercase;letter-spacing:.13em;line-height:1}.headline{display:block;margin-top:4px;font-size:11px;line-height:1;font-weight:820;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.select{max-width:111px;border:1px solid #47728b;border-radius:7px;background:#133850;color:#eefaff;padding:6px 5px;font-size:8px;outline:none;cursor:pointer}
    .stage{position:relative;height:calc(100% - 48px);padding:4px 7px 29px}.radar{display:block;width:100%;height:162px;overflow:visible}.grid{fill:none;stroke:rgba(154,207,223,.25);stroke-width:1}.axis{stroke:rgba(154,207,223,.42);stroke-width:1}.axis-label{fill:#d9edf7;font-size:7px;font-weight:760;paint-order:stroke;stroke:#082035;stroke-width:2.5px;stroke-linejoin:round}.level-label{fill:#8fb2c4;font-size:6px}.shape{fill:rgba(75,224,208,.23);stroke:#4be0d0;stroke-width:2;transition:all .28s ease}.vertex{fill:#fff;stroke:#4be0d0;stroke-width:2;cursor:pointer;transition:.14s}.vertex:hover{r:5}.center-name{fill:#effaff;font-size:11px;font-weight:850;text-anchor:middle}.center-meta{fill:#a8c8d8;font-size:7px;text-anchor:middle}.domain{cursor:pointer}.domain:hover .axis-label{fill:#7ceddf}.domain.active .axis-label{fill:#7ceddf}
    .summary{position:absolute;left:8px;right:8px;bottom:29px;min-height:52px;padding:7px 8px;border-left:3px solid var(--aqua);border-radius:5px;background:rgba(6,24,39,.93);font-size:8px;line-height:1.34}.summary strong{display:block;color:#79eadc;font-size:9px;margin-bottom:2px}.state{display:inline-block;margin-left:4px;border-radius:999px;padding:2px 4px;font-size:7px;font-weight:850;vertical-align:1px}.s0{background:rgba(150,170,180,.18);color:#d4e1e7}.s1{background:rgba(247,200,95,.18);color:#ffe4a0}.s2{background:rgba(99,185,255,.18);color:#c8eaff}.s3{background:rgba(75,213,155,.18);color:#c7ffe3}.footer{position:absolute;left:6px;right:6px;bottom:6px;margin:0;text-align:center;color:#a9c7d8;font-size:7px;line-height:1.15}.legend{position:absolute;top:5px;right:8px;display:flex;gap:4px;color:#a8c8d8;font-size:6px}.legend span{display:inline-flex;align-items:center;gap:2px}.dot{width:5px;height:5px;border-radius:50%;display:inline-block}
    @media(max-width:380px){.headline{font-size:10px}.select{max-width:100px;font-size:7px}.stage{padding-left:4px;padding-right:4px}.axis-label{font-size:6px}.summary{left:5px;right:5px;font-size:7px}.radar{height:158px}}
  </style>
</head>
<body>
<div class="widget">
 <div class="header"><div><span class="eyebrow">Mission-return evidence profiles</span><span class="headline">Where is return observable, emerging or undocumented?</span></div><select id="mission" class="select" aria-label="Select mission"></select></div>
 <div class="stage"><svg class="radar" id="radar" viewBox="0 0 300 175" aria-label="Seven-domain mission return evidence radar"></svg><div class="legend"><span><i class="dot" style="background:#4bd59b"></i>3 strong</span><span><i class="dot" style="background:#63baff"></i>2 observed</span><span><i class="dot" style="background:#f7c85f"></i>1 early</span></div><div class="summary" id="summary"></div><p class="footer">Click a radar axis. Extent = evidence maturity/coverage, not ROI, ranking or mission quality.</p></div>
</div>
<script>
const domains=[
 {id:'economic',label:'Direct\neconomic',short:'Direct economic',about:'Sales, contracts, licences, data subscriptions and realised revenue. Grants are resources or inputs, not automatically return.'},
 {id:'industrial',label:'Industrial\ncapability',short:'Industrial capability',about:'Flight heritage, reusable platforms, technical qualification, supplier learning and later product or service options.'},
 {id:'scientific',label:'Scientific',short:'Scientific',about:'Publications, datasets, discoveries, conference outputs and mission-enabled research.'},
 {id:'workforce',label:'Education &\nworkforce',short:'Education & workforce',about:'Student involvement, systems-engineering skills, career pathways and talent retention.'},
 {id:'strategic',label:'Strategic-\npolicy',short:'Strategic-policy',about:'National capability, visibility, ESA/EU integration, sovereignty and policy learning.'},
 {id:'ecosystem',label:'Ecosystem',short:'Ecosystem',about:'University–industry links, repeated collaborations, cross-border supply chains and regional networks.'},
 {id:'sustainability',label:'Sustainability',short:'Sustainability',about:'Deorbit planning, collision awareness, responsible operations, efficiency and reusable responsible-space capabilities.'}
];
const missions=[
 {name:'WREN-1',meta:'Operational · EO demonstrator',color:'#4be0d0',values:[1,3,2,2,2,2,1],notes:{economic:'Early and conflicting signal: C3S reports limited, commercially immaterial data-package sales; Combit reports no verified sales. Subscription-scale ROI is not demonstrated.',industrial:'Observed: end-to-end EO mission learning, multispectral/SWIR acquisition, ground workflow and platform/partner heritage.',scientific:'Observed: commissioning micro-vibration research and WREN-linked soil-moisture-method output.',workforce:'Observed but incompletely quantified: participant and university–industry learning pathways are reported.',strategic:'Observed: national visibility, operational collaboration and public-procurement learning.',ecosystem:'Observed: Combit–C3S–university collaboration; cross-institutional EO pathway.',sustainability:'Partial evidence: passive orbit and expected orbital lifetime, but limited public disposal/collision-readiness detail.'}},
 {name:'Mauve',meta:'Scientific operations · data service',color:'#f7c85f',values:[1,3,3,1,2,3,1],notes:{economic:'Early/unaudited: membership offer and customer-service architecture are observable, but paid memberships, revenue, renewals and profit are not public.',industrial:'Strong observed capability: C3S 16U platform, IPC reuse, integration and scalable mission-service heritage.',scientific:'Strong observed pathway: first data delivery, instrument simulator, science programme and instrument publications.',workforce:'Evidence exists through international science and industrial participation, but mission-specific career/retention data are limited.',strategic:'Observed: international science-service visibility and European industrial collaboration.',ecosystem:'Strong observed network: UK, Hungarian, Dutch, Italian and wider scientific-community roles.',sustainability:'Limited public evidence on detailed disposal and end-of-life planning.'}},
 {name:'GRBAlpha',meta:'Completed · science-led mission',color:'#9b8cff',values:[0,2,3,2,2,3,1],notes:{economic:'No direct economic return was reported.',industrial:'Observed: detector validation, long-duration ageing evidence and follow-on constellation/platform option value.',scientific:'Strong quantified evidence: 227 classified transients, including 124 GRBs; open catalogue and extreme-event science.',workforce:'Observed student work and international research participation; long-term career evidence is incomplete.',strategic:'Observed: international visibility and participation in the gamma-ray astronomy network.',ecosystem:'Strong cross-border science network linking Slovak spacecraft roles, Hungarian science leadership and international partners.',sustainability:'Public end-of-life and detailed responsible-operations evidence is incomplete.'}},
 {name:'CroCube',meta:'Operational · Croatia’s first satellite',color:'#63baff',values:[0,1,0,2,3,3,1],notes:{economic:'No publicly verified revenue, investment or job-impact evidence.',industrial:'Early integration and mission-learning signal, primarily through regional technical delivery.',scientific:'No mature public scientific-return evidence in the current portfolio record.',workforce:'Observed education, outreach and first-mission learning; longitudinal career impact remains unknown.',strategic:'Strong observed national-first visibility, identity and ecosystem-activation value.',ecosystem:'Strong observed Croatia–Slovakia–Hungary collaboration across national identity, integration and operations.',sustainability:'End-of-life evidence and responsible-space documentation remain incomplete.'}},
 {name:'RadCube',meta:'Completed · ESA-linked technology mission',color:'#4bd59b',values:[0,3,2,1,3,3,1],notes:{economic:'No mission-attributable public sales or order value.',industrial:'Strong observed ESA-prime contractor and multinational qualification heritage.',scientific:'Observed space-weather and component-radiation scientific output.',workforce:'Participation is visible, but quantified workforce/career evidence is limited.',strategic:'Strong ESA-linked role and national industrial positioning.',ecosystem:'Strong multinational consortium and supplier/network pathway.',sustainability:'Limited public sustainability-performance evidence at mission level.'}},
 {name:'skCube',meta:'Completed · Slovakia’s first CubeSat',color:'#918dff',values:[0,2,1,3,3,2,1],notes:{economic:'No reliable mission-attributable revenue or full-cost evidence.',industrial:'Observed technical and integration heritage feeding later Spacemanic capability.',scientific:'Limited technical/scientific output evidence compared with later science missions.',workforce:'Strong education and volunteer/university capability-building pathway.',strategic:'Strong national-first visibility and legitimacy.',ecosystem:'Observed contribution to the Slovak mission and integration ecosystem.',sustainability:'Limited public evidence on end-of-life and responsible-space practice.'}}
];
const svg=document.getElementById('radar');const select=document.getElementById('mission');const summary=document.getElementById('summary');let current=missions[0];let activeDomain='';
missions.forEach(function(m){const o=document.createElement('option');o.value=m.name;o.textContent=m.name;select.appendChild(o);});
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function point(i,r){const cx=150,cy=86,a=-Math.PI/2+i*(2*Math.PI/7);return [cx+Math.cos(a)*r,cy+Math.sin(a)*r];}
function pstr(points){return points.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' ');}
function lines(text,x,y,anchor){return text.split('\n').map(function(t,i){return '<text x="'+x.toFixed(1)+'" y="'+(y+i*8).toFixed(1)+'" text-anchor="'+anchor+'" class="axis-label">'+esc(t)+'</text>';}).join('');}
function state(v){return v===0?['No public evidence / not applicable','s0']:v===1?['Early, expected or partial evidence','s1']:v===2?['Observed, but unquantified or incomplete','s2']:['Observed and comparatively well substantiated','s3'];}
function showDomain(id){activeDomain=id;render();}
function render(){const maxR=57;let out='';[1,2,3].forEach(function(level){out+='<polygon class="grid" points="'+pstr(domains.map(function(_,i){return point(i,maxR*level/3);}))+ '"></polygon>';});domains.forEach(function(d,i){const end=point(i,maxR);out+='<g class="domain '+(activeDomain===d.id?'active':'')+'" data-id="'+d.id+'"><line class="axis" x1="150" y1="86" x2="'+end[0].toFixed(1)+'" y2="'+end[1].toFixed(1)+'"></line>';const lp=point(i,74);let anchor='middle';if(lp[0]<120)anchor='end';if(lp[0]>180)anchor='start';out+=lines(d.label,lp[0],lp[1]-3,anchor)+'</g>';});out+='<text x="154" y="30" class="level-label">3</text><text x="153" y="49" class="level-label">2</text><text x="152" y="68" class="level-label">1</text>';const pts=current.values.map(function(v,i){return point(i,maxR*v/3);});out+='<polygon class="shape" style="fill:'+current.color+'33;stroke:'+current.color+'" points="'+pstr(pts)+'"></polygon>';pts.forEach(function(p,i){out+='<circle class="vertex" data-id="'+domains[i].id+'" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.3" style="stroke:'+current.color+'"></circle>';});out+='<text x="150" y="82" class="center-name">'+esc(current.name)+'</text><text x="150" y="94" class="center-meta">'+esc(current.meta)+'</text>';svg.innerHTML=out;svg.querySelectorAll('.domain,.vertex').forEach(function(el){el.addEventListener('click',function(){showDomain(el.dataset.id);});});const d=activeDomain?domains.find(function(x){return x.id===activeDomain;}):null;if(d){const i=domains.indexOf(d),v=current.values[i],st=state(v);summary.style.borderLeftColor=current.color;summary.innerHTML='<strong>'+esc(d.short)+' <span class="state '+st[1]+'">'+st[0]+'</span></strong>'+esc(current.notes[d.id])+'<br><span style="color:#9fc0d2;font-size:7px">Axis meaning: '+esc(d.about)+'</span>';}else{summary.style.borderLeftColor=current.color;summary.innerHTML='<strong>'+esc(current.name)+' <span class="state s2">Select an axis</span></strong>This profile maps evidence maturity across seven return domains. Click an axis to see the evidence interpretation and boundary for this mission.';}}
select.addEventListener('change',function(){current=missions.find(function(m){return m.name===select.value;});activeDomain='';render();});render();
</script>
</body>
</html>
