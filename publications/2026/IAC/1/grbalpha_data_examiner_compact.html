<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GRBAlpha Data Examiner</title>
  <style>
    :root{--bg:#071724;--line:#2d5d79;--text:#eefaff;--muted:#aac8d9;--aqua:#4be0d0;--violet:#9b8cff;--orange:#f7a95a;--yellow:#f7d45c;--blue:#63baff;--green:#4bd59b}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
    .widget{position:relative;width:100%;height:100%;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:radial-gradient(circle at 83% 2%,rgba(128,92,190,.27),transparent 40%),linear-gradient(135deg,#102642,#071724)}
    .header{height:47px;display:flex;justify-content:space-between;align-items:center;gap:7px;padding:7px 9px;border-bottom:1px solid rgba(109,176,203,.24);background:rgba(7,23,36,.78)}.eyebrow{display:block;color:#cbbfff;font-size:7px;font-weight:850;text-transform:uppercase;letter-spacing:.13em;line-height:1}.headline{display:block;margin-top:4px;font-size:11px;line-height:1;font-weight:820;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.days{border:1px solid rgba(155,140,255,.55);border-radius:999px;background:rgba(155,140,255,.12);color:#ded7ff;padding:5px 6px;font-size:7px;white-space:nowrap}
    .stage{position:relative;height:calc(100% - 47px);padding:6px 7px 29px}.visual{position:relative;height:136px;border:1px solid rgba(112,160,198,.27);border-radius:9px;background:radial-gradient(circle at 50% 47%,rgba(70,56,127,.42),transparent 34%),linear-gradient(135deg,rgba(18,43,78,.8),rgba(12,28,58,.8));overflow:hidden}.stars{position:absolute;inset:0;background-image:radial-gradient(circle at 12% 20%,#fff 0 1px,transparent 1.5px),radial-gradient(circle at 24% 67%,#bde7ff 0 1px,transparent 1.5px),radial-gradient(circle at 79% 24%,#fff 0 1px,transparent 1.5px),radial-gradient(circle at 89% 72%,#d5caff 0 1px,transparent 1.5px),radial-gradient(circle at 65% 81%,#fff 0 1px,transparent 1.5px),radial-gradient(circle at 35% 32%,#cceaff 0 1px,transparent 1.5px);opacity:.65}.chart{position:absolute;left:10px;top:8px;width:120px;height:120px;overflow:visible}.arc{fill:none;stroke-linecap:round;cursor:pointer;transition:stroke-width .16s ease,opacity .16s ease}.arc:hover,.arc.active{stroke-width:18!important;opacity:1!important}.total{fill:#effaff;font-size:23px;font-weight:900;text-anchor:middle}.totalSub{fill:#bcd5e4;font-size:7px;text-anchor:middle}.chartLabel{fill:#eaf8ff;font-size:7px;font-weight:770;text-anchor:middle;pointer-events:none}.sideStats{position:absolute;right:8px;top:13px;width:calc(100% - 147px);display:grid;gap:5px}.stat{border:1px solid rgba(118,181,210,.34);border-radius:6px;background:rgba(10,35,60,.76);padding:5px 6px;color:#dcecf5;font-size:7px;line-height:1.18;cursor:pointer;transition:.14s ease}.stat:hover,.stat.active{transform:translateX(-2px);border-color:#b9afff;background:#312f62}.stat b{display:block;color:#e9e4ff;font-size:8px;margin-bottom:1px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:6px}.tab{border:1px solid rgba(107,178,204,.4);border-radius:7px;background:#12364f;color:#d7eaf4;padding:6px 3px;font-size:7px;font-weight:780;line-height:1.1;cursor:pointer}.tab:hover,.tab.active{border-color:var(--violet);background:#3c3c72;color:#fff}
    .card{position:absolute;left:7px;right:7px;bottom:29px;min-height:61px;padding:7px 8px;border-left:3px solid var(--violet);border-radius:5px;background:rgba(6,24,39,.94);font-size:8px;line-height:1.34}.card h2{margin:0 0 2px;color:#d2caff;font-size:9px}.card p{margin:0;color:#d9eaf3}.tag{display:inline-block;margin-top:4px;border-radius:999px;padding:2px 4px;font-size:7px;font-weight:850}.tag.science{background:rgba(155,140,255,.19);color:#ded7ff}.tag.open{background:rgba(75,224,208,.16);color:#c5fff5}.footer{position:absolute;left:6px;right:6px;bottom:6px;margin:0;text-align:center;color:#a9c7d8;font-size:7px;line-height:1.16}
    @media(max-width:380px){.headline{font-size:10px}.days{font-size:6px}.stage{padding-left:5px;padding-right:5px}.chart{left:5px}.sideStats{right:5px;width:calc(100% - 138px)}.stat{font-size:6px}.stat b{font-size:7px}.card{left:5px;right:5px;font-size:7px}.tab{font-size:6px}}
  </style>
</head>
<body>
<div class="widget">
 <div class="header"><div><span class="eyebrow">GRBAlpha Data Examiner</span><span class="headline">Explore 227 classified high-energy transients</span></div><span class="days">&gt;1,500 days</span></div>
 <div class="stage"><div class="visual"><div class="stars"></div><svg class="chart" id="chart" viewBox="0 0 120 120" aria-label="GRBAlpha classified event categories"></svg><div class="sideStats" id="stats"></div></div><div class="tabs"><button class="tab active" data-view="catalogue">Catalogue</button><button class="tab" data-view="boat">Extreme event</button><button class="tab" data-view="detector">Detector heritage</button></div><div class="card" id="card"></div><p class="footer">Event counts are scientific outputs—not monetary benefits or a financial ROI.</p></div>
</div>
<script>
const events=[
 {id:'grb',name:'Gamma-ray bursts',count:124,color:'#9b8cff',desc:'GRBAlpha detected 124 gamma-ray bursts: 104 long and 20 short events in the complete catalogue. The detections include bursts to redshift z = 4.2 and contribute complementary evidence to international localisation networks.'},
 {id:'solar',name:'Solar flares',count:100,color:'#f7a95a',desc:'100 solar flares demonstrate sustained, multi-year observation of high-energy solar activity by a compact CubeSat detector.'},
 {id:'sgr',name:'Soft gamma repeater',count:2,color:'#4be0d0',desc:'Two soft-gamma-repeater events appear in the complete classified catalogue, extending the mission’s high-energy transient coverage beyond GRBs and solar flares.'},
 {id:'xray',name:'X-ray binary',count:1,color:'#63baff',desc:'One X-ray-binary outburst was classified in the mission catalogue.'}
];
const views={
 catalogue:{title:'Complete mission catalogue',text:'GRBAlpha operated from March 2021 to June 2025 and generated 227 classified high-energy transient detections. Public products include raw and background-subtracted light curves and machine-readable catalogue tables.',tag:'QUANTIFIED OPEN-SCIENCE RETURN',tagClass:'open'},
 boat:{title:'GRB 221009A — an exceptional event',text:'GRBAlpha recorded GRB 221009A without saturation, providing a valuable measurement of one of the brightest gamma-ray bursts ever observed. The result illustrates how a small detector can complement larger observatories.',tag:'OBSERVED EXTREME-EVENT SCIENCE',tagClass:'science'},
 detector:{title:'More than four years of detector heritage',text:'Shielded Hamamatsu SiPMs were characterised in low-Earth orbit for more than four years. Measured degradation and threshold drift provide reusable evidence for future compact gamma-ray instrument design.',tag:'OBSERVED INSTRUMENT VALIDATION',tagClass:'science'}
};
const svg=document.getElementById('chart'),stats=document.getElementById('stats'),card=document.getElementById('card');let active='grb';let view='catalogue';
function polar(cx,cy,r,a){const rad=(a-90)*Math.PI/180;return[cx+r*Math.cos(rad),cy+r*Math.sin(rad)];}
function arc(cx,cy,r,start,end){const s=polar(cx,cy,r,end),e=polar(cx,cy,r,start),large=end-start<=180?0:1;return 'M '+s[0]+' '+s[1]+' A '+r+' '+r+' 0 '+large+' 0 '+e[0]+' '+e[1];}
function renderChart(){let angle=0;const total=227;let out='';events.forEach(function(e){const span=e.count/total*360-2;out+='<path class="arc '+(active===e.id?'active':'')+'" data-id="'+e.id+'" d="'+arc(60,60,38,angle,angle+span)+'" stroke="'+e.color+'" stroke-width="13" opacity="'+(active===e.id?'1':'.68')+'"></path>';angle+=span+2;});out+='<text x="60" y="58" class="total">227</text><text x="60" y="70" class="totalSub">classified events</text>';svg.innerHTML=out;svg.querySelectorAll('.arc').forEach(function(el){el.addEventListener('click',function(){active=el.dataset.id;view='event';render();});});}
function renderStats(){stats.innerHTML=events.map(function(e){return '<button class="stat '+(active===e.id&&view==='event'?'active':'')+'" data-id="'+e.id+'"><b style="color:'+e.color+'">'+e.count+' · '+e.name+'</b>Click to examine</button>';}).join('');stats.querySelectorAll('.stat').forEach(function(el){el.addEventListener('click',function(){active=el.dataset.id;view='event';render();});});}
function renderCard(){let c;if(view==='event'){const e=events.find(function(x){return x.id===active;});c={title:e.count+' '+e.name,text:e.desc,tag:'CATALOGUE EVIDENCE',tagClass:'science',color:e.color};}else{const v=views[view];c={title:v.title,text:v.text,tag:v.tag,tagClass:v.tagClass,color:view==='catalogue'?'#4be0d0':'#9b8cff'};}card.style.borderLeftColor=c.color;card.innerHTML='<h2>'+c.title+'</h2><p>'+c.text+'</p><span class="tag '+c.tagClass+'">'+c.tag+'</span>';}
function render(){renderChart();renderStats();renderCard();document.querySelectorAll('.tab').forEach(function(btn){btn.classList.toggle('active',btn.dataset.view===view);});}
document.querySelectorAll('.tab').forEach(function(btn){btn.addEventListener('click',function(){view=btn.dataset.view;render();});});render();
</script>
</body>
</html>
