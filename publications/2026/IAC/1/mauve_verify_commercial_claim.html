<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mauve Claim Verifier</title>
  <style>
    :root{--bg:#071724;--line:#2d5d79;--text:#eefaff;--muted:#aac8d9;--aqua:#4be0d0;--violet:#9b8cff;--green:#4bd59b;--amber:#f7c85f;--red:#ff7e7e;--blue:#63baff}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
    .widget{position:relative;width:100%;height:100%;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:radial-gradient(circle at 86% 3%,rgba(112,88,181,.28),transparent 40%),linear-gradient(135deg,#102642,#071724)}
    .header{height:47px;display:flex;align-items:center;justify-content:space-between;gap:7px;padding:7px 9px;border-bottom:1px solid rgba(109,176,203,.24);background:rgba(7,23,36,.78)}.eyebrow{display:block;color:#cbbfff;font-size:7px;font-weight:850;text-transform:uppercase;letter-spacing:.13em;line-height:1}.headline{display:block;margin-top:4px;font-size:11px;line-height:1;font-weight:820;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.reset{border:1px solid #506e90;border-radius:999px;background:#173852;color:#d8e8f5;font-size:7px;padding:5px 7px;cursor:pointer}.reset:hover{border-color:#d2c8ff;background:#394071}
    .stage{position:relative;height:calc(100% - 47px);padding:8px 8px 29px}.claim{margin:0 0 6px;padding:6px 7px;border:1px solid rgba(196,184,255,.44);border-radius:7px;background:rgba(69,56,126,.35);color:#f2efff;font-size:8px;line-height:1.25}.claim b{color:#d6ceff}.prompt{margin:0 0 6px;color:#c8ddea;font-size:8px;line-height:1.24}.evidence{display:grid;grid-template-columns:1fr 1fr;gap:5px}.tile{position:relative;min-height:34px;padding:5px 5px 4px 20px;border:1px solid rgba(113,180,207,.38);border-radius:7px;background:rgba(16,52,76,.78);color:#eaf8ff;text-align:left;font-size:7px;font-weight:760;line-height:1.14;cursor:pointer;transition:.14s ease}.tile:hover{transform:translateY(-1px);border-color:#83d9e3;background:#1c5369}.tile.selected{border-color:var(--aqua);background:#1b5b67;box-shadow:0 0 10px rgba(75,224,208,.25)}.tile .check{position:absolute;left:5px;top:8px;display:grid;place-items:center;width:11px;height:11px;border:1px solid #678aa0;border-radius:3px;color:transparent;font-size:9px;line-height:1}.tile.selected .check{border-color:var(--aqua);background:var(--aqua);color:#082431}.tile.observed:after{content:'OBS.';position:absolute;right:4px;bottom:3px;color:#bfffe0;font-size:5.5px;font-weight:850}.tile.required:after{content:'NEEDED';position:absolute;right:4px;bottom:3px;color:#ffe2a0;font-size:5.5px;font-weight:850}.tile.observed{border-left:3px solid var(--green)}.tile.required{border-left:3px dashed var(--amber)}
    .result{position:absolute;left:8px;right:8px;bottom:29px;min-height:55px;padding:7px 8px;border-left:3px solid var(--violet);border-radius:5px;background:rgba(6,24,39,.94);font-size:8px;line-height:1.33}.result strong{display:block;margin-bottom:2px;color:#d2caff;font-size:9px}.badge{display:inline-block;margin-left:4px;padding:2px 4px;border-radius:999px;font-size:7px;font-weight:850;vertical-align:1px}.badge.partial{background:rgba(247,200,95,.18);color:#ffe4a0}.badge.ok{background:rgba(75,213,155,.18);color:#c7ffe3}.badge.missing{background:rgba(255,126,126,.17);color:#ffd0d0}.footer{position:absolute;left:6px;right:6px;bottom:6px;margin:0;text-align:center;color:#a9c7d8;font-size:7px;line-height:1.16}
    @media(max-width:380px){.headline{font-size:10px}.stage{padding-left:6px;padding-right:6px}.tile{font-size:6.5px;min-height:32px}.result{left:6px;right:6px;font-size:7px}.reset{font-size:6px}}
  </style>
</head>
<body>
<div class="widget">
 <div class="header"><div><span class="eyebrow">Mauve — Technology Readiness → Service Readiness</span><span class="headline">Can you verify the commercial-service claim?</span></div><button class="reset" id="reset">Reset</button></div>
 <div class="stage"><p class="claim"><b>Claim:</b> “Mauve is already a profitable, recurring commercial data service.”</p><p class="prompt">Select the evidence needed to verify this claim.</p><div class="evidence" id="evidence"></div><div class="result" id="result"></div><p class="footer">Observed operational service evidence is not automatically financial evidence.</p></div>
</div>
<script>
const tiles=[
 {id:'platform',label:'16U platform + UV instrument',type:'observed',needed:false,info:'Shows qualified spacecraft and payload capability.'},
 {id:'firstdata',label:'First programme datasets delivered',type:'observed',needed:false,info:'Shows that scientific operations and initial delivery have begun.'},
 {id:'membership',label:'Annual membership model + Stardrive',type:'observed',needed:false,info:'Shows a defined service and access architecture.'},
 {id:'community',label:'International science community',type:'observed',needed:false,info:'Shows a named user-network pathway, not necessarily paid demand.'},
 {id:'paying',label:'Paying-member count',type:'required',needed:true,info:'Needed to establish a confirmed commercial customer base.'},
 {id:'renewal',label:'Membership price + renewal rate',type:'required',needed:true,info:'Needed to demonstrate repeatable demand and retention.'},
 {id:'revenue',label:'Recognised service revenue',type:'required',needed:true,info:'Needed to separate revenue from grants, pipeline or forecast.'},
 {id:'margin',label:'Service cost + margin / profit',type:'required',needed:true,info:'Needed to test commercial sustainability and profitability.'},
 {id:'investment',label:'Audited investment denominator',type:'required',needed:true,info:'Needed to calculate a defensible financial ROI.'}
];
const selected=new Set();const grid=document.getElementById('evidence');const result=document.getElementById('result');
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function render(){grid.innerHTML=tiles.map(function(t){return '<button class="tile '+t.type+(selected.has(t.id)?' selected':'')+'" data-id="'+t.id+'"><span class="check">✓</span>'+esc(t.label)+'</button>';}).join('');document.querySelectorAll('.tile').forEach(function(el){el.addEventListener('click',function(){const id=el.dataset.id;if(selected.has(id))selected.delete(id);else selected.add(id);render();});});const required=tiles.filter(function(t){return t.needed;});const found=required.filter(function(t){return selected.has(t.id);});const observed=tiles.filter(function(t){return !t.needed&&selected.has(t.id);});const missing=required.filter(function(t){return !selected.has(t.id);});if(found.length===required.length){result.innerHTML='<strong>Correct evidence set <span class="badge ok">COMMERCIAL CLAIM CAN BE TESTED</span></strong>You selected the disclosures needed to test paying demand, recurring revenue, profitability and ROI. These data are not public in the current evidence base, so the claim cannot yet be verified.';}else if(found.length>0){result.innerHTML='<strong>Partly correct <span class="badge partial">'+found.length+' / '+required.length+' COMMERCIAL GATES</span></strong>Selected evidence helps, but still missing: '+missing.map(function(x){return x.label;}).join('; ')+'. Operational indicators alone do not verify profitability.';}else if(observed.length>0){result.innerHTML='<strong>Operational evidence selected <span class="badge partial">SERVICE ARCHITECTURE</span></strong>Your selection supports a different conclusion: Mauve has an observed operating scientific data-service architecture. It does not verify paid membership, revenue, margin or financial ROI.';}else{result.innerHTML='<strong>Choose evidence tiles <span class="badge missing">START HERE</span></strong>Which disclosures would you need to verify a profitable, recurring commercial data service—not merely a technically operating mission?';}}
document.getElementById('reset').addEventListener('click',function(){selected.clear();render();});render();
</script>
</body>
</html>
