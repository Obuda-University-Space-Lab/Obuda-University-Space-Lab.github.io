<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WREN-1 EO Value Explorer</title>
  <style>
    :root{--bg:#071724;--panel:#0d2a40;--line:#2d5d79;--text:#eefaff;--muted:#aac8d9;--aqua:#4be0d0;--green:#4bd59b;--blue:#62b9ff;--violet:#9a8cff;--amber:#f7c85f;--red:#ff7e7e}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
    .widget{width:100%;height:100%;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:radial-gradient(circle at 85% 3%,rgba(50,157,187,.25),transparent 38%),linear-gradient(135deg,#0c273d,#071724)}
    .header{height:47px;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid rgba(109,176,203,.24);background:rgba(7,23,36,.78)}.eyebrow{display:block;color:#71e7d9;font-size:7px;font-weight:850;text-transform:uppercase;letter-spacing:.13em;line-height:1}.headline{display:block;margin-top:4px;font-size:12px;line-height:1;font-weight:820;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hint{color:#b7d5e5;font-size:7px;text-align:right;line-height:1.25;white-space:nowrap}
    .stage{position:relative;height:calc(100% - 47px);padding:8px 8px 29px}.map-area{position:relative;height:120px;border:1px solid rgba(95,165,193,.27);border-radius:9px;background:radial-gradient(ellipse at 48% 95%,rgba(53,131,148,.37),transparent 47%),linear-gradient(180deg,#123d58 0%,#0b2a42 57%,#123d3a 58%,#0c292f 100%);overflow:hidden}.orbit{position:absolute;left:17%;right:17%;top:19px;height:42px;border:1px dashed rgba(128,215,235,.42);border-radius:50%;transform:rotate(-10deg)}.satellite{position:absolute;z-index:4;left:calc(50% - 18px);top:23px;width:36px;height:23px;cursor:pointer;filter:drop-shadow(0 0 9px rgba(75,224,208,.8));transition:.16s ease}.satellite:hover,.satellite.active{transform:scale(1.12)}.bus{position:absolute;left:10px;top:4px;width:16px;height:15px;border:2px solid #e7fbff;border-radius:3px;background:#4b8ba2}.panelL,.panelR{position:absolute;top:7px;width:11px;height:8px;background:#62b9ff;border:1px solid #b5ebff}.panelL{left:0}.panelR{right:0}.lens{position:absolute;left:15px;top:7px;width:8px;height:8px;border:2px solid #f7c85f;border-radius:50%;background:#102e4a}.ground{position:absolute;left:50%;bottom:17px;width:5px;height:5px;border-radius:50%;background:#f7c85f;box-shadow:0 0 0 3px rgba(247,200,95,.17),0 0 12px rgba(247,200,95,.85);transform:translateX(-50%)}.beam{position:absolute;left:50%;top:44px;width:72px;height:57px;transform:translateX(-50%);clip-path:polygon(43% 0,57% 0,100% 100%,0 100%);background:linear-gradient(180deg,rgba(75,224,208,.42),rgba(75,224,208,.03));pointer-events:none}.target{position:absolute;bottom:10px;width:27px;height:18px;border:1px solid rgba(214,248,245,.75);border-radius:4px;background:rgba(37,106,92,.67);cursor:pointer;transition:.15s ease}.target:hover,.target.active{transform:translateY(-3px) scale(1.07);border-color:#fff;box-shadow:0 0 12px rgba(75,224,208,.8)}.target span{position:absolute;left:50%;bottom:-13px;transform:translateX(-50%);color:#d9f5f2;font-size:7px;white-space:nowrap}.farm{left:20%}.water{left:calc(50% - 13px);background:rgba(44,124,171,.7)}.city{right:20%;background:rgba(102,91,70,.72)}.city:before{content:'';position:absolute;left:7px;bottom:2px;width:4px;height:11px;background:#8d9aa0;box-shadow:6px -4px #a5b6ba,12px 1px #87969d}.data-path{position:absolute;z-index:3;top:58px;left:50%;height:2px;width:0;background:var(--aqua);box-shadow:0 0 8px var(--aqua);transform-origin:left center;transition:width .45s ease}.data-path.show{width:92px}.data-dot{position:absolute;z-index:4;top:54px;left:calc(50% + 85px);display:none;width:10px;height:10px;border-radius:50%;background:var(--aqua);box-shadow:0 0 12px var(--aqua)}.data-dot.show{display:block;animation:pulse 1.2s infinite}@keyframes pulse{50%{transform:scale(1.35);opacity:.55}}
    .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:7px}.tab{border:1px solid rgba(107,178,204,.4);border-radius:7px;background:#12364f;color:#d7eaf4;padding:6px 3px;font-size:8px;font-weight:780;line-height:1.1;cursor:pointer}.tab:hover,.tab.active{border-color:var(--aqua);background:#1c586d;color:#fff}.tab.science.active{border-color:var(--violet);background:#3a3b69}.tab.market.active{border-color:var(--amber);background:#6a5325}.tab.capability.active{border-color:var(--green);background:#1b5d4b}
    .card{position:absolute;left:8px;right:8px;bottom:29px;min-height:76px;padding:8px 9px;border-left:3px solid var(--aqua);border-radius:6px;background:rgba(6,24,39,.93);font-size:8px;line-height:1.37}.card h2{margin:0 0 3px;font-size:10px;color:#78eadc}.card p{margin:0;color:#d7e9f3}.card .tag{display:inline-block;margin-top:5px;border-radius:999px;padding:3px 5px;font-size:7px;font-weight:850}.tag.observed{background:rgba(75,213,155,.18);color:#c5ffe2}.tag.emerging{background:rgba(247,200,95,.18);color:#ffe6a5}.tag.open{background:rgba(255,126,126,.17);color:#ffd0d0}.card .action{display:block;margin-top:5px;color:#a9c8d8;font-size:7px}.footer{position:absolute;left:7px;right:7px;bottom:6px;margin:0;text-align:center;color:#a9c7d8;font-size:7px;line-height:1.17}
    @media(max-width:380px){.headline{font-size:11px}.hint{display:none}.stage{padding-left:6px;padding-right:6px}.card{left:6px;right:6px;font-size:7px}.tab{font-size:7px}.target span{font-size:6px}}
  </style>
</head>
<body>
<div class="widget">
 <div class="header"><div><span class="eyebrow">WREN-1 — Earth Observation</span><span class="headline">From EO capability to scientific and market use</span></div><span class="hint">Click a ground target<br>or a value lens</span></div>
 <div class="stage">
  <div class="map-area" id="mapArea"><div class="orbit"></div><div class="satellite" id="satellite" title="WREN-1 EO platform"><div class="panelL"></div><div class="bus"></div><div class="lens"></div><div class="panelR"></div></div><div class="beam"></div><div class="data-path" id="dataPath"></div><div class="data-dot" id="dataDot"></div><div class="ground"></div><button class="target farm" data-target="farm"><span>Fields</span></button><button class="target water" data-target="water"><span>Water</span></button><button class="target city" data-target="city"><span>City</span></button></div>
  <div class="tabs"><button class="tab capability active" data-lens="capability">EO capability</button><button class="tab science" data-lens="science">Scientific use</button><button class="tab market" data-lens="market">Market use</button></div>
  <div class="card" id="card"></div><p class="footer">Interactive concept map: observed capability, research outputs and service-conversion needs are kept distinct.</p>
 </div>
</div>
<script>
const content={
 capability:{title:'EO capability: the demonstrated asset',border:'#4bd59b',text:'WREN-1 is an operational 6U Earth-observation CubeSat. Its multispectral and SWIR imaging capability, with about 16 m ground sampling, supports acquisition of spatially explicit environmental imagery.',tag:'OBSERVED CAPABILITY',tagClass:'observed',action:'Click Fields, Water or City to see example application pathways.'},
 science:{title:'Scientific use: from image to evidence',border:'#9a8cff',text:'The mission has already generated engineering and research outputs: micro-vibration analysis from commissioning data and remote-sensing soil-moisture work linked to WREN. These are mission-enabled scientific and technical results.',tag:'OBSERVED / EARLY SCIENTIFIC RETURN',tagClass:'observed',action:'Select Fields to explore soil-moisture and drought research relevance.'},
 market:{title:'Market use: from data to service',border:'#f7c85f',text:'A marketable EO service requires more than imagery: automated tasking and processing, usable cadence under cloud and daylight limits, validated users, repeat orders and follow-on finance. These conversion gates remain open.',tag:'EARLY VALIDATION — NOT SUBSCRIPTION-SCALE ROI',tagClass:'emerging',action:'Select a ground target to explore possible users and service constraints.'},
 farm:{title:'Fields: drought and soil-moisture support',border:'#4be0d0',text:'Potential application: agricultural drought monitoring and topsoil-moisture information. WREN has delivered imagery and supported associated soil-moisture-method work, but the path to routine user adoption and paid repeat service remains unverified.',tag:'APPLIED EO PATHWAY — EMERGING',tagClass:'emerging',action:'Market gate: validate decision value, tasking cadence and willingness to pay.'},
 water:{title:'Water: environmental monitoring potential',border:'#62b9ff',text:'Multispectral and SWIR observations can support environmental interpretation where water and land conditions matter. For WREN, this is an EO capability and option value; a validated operational water-information service has not been demonstrated.',tag:'SERVICE OPTION — NOT YET VALIDATED',tagClass:'open',action:'Scientific gate: establish calibrated products and repeatable validation with users.'},
 city:{title:'City: spatial decision-support option',border:'#f7c85f',text:'The platform can contribute imagery to location-based assessment and public-interest decision support. However, one-satellite revisit, cloud and daylight constraints limit the reliability required for an operational, repeatable urban service.',tag:'MARKET OPTION — OPEN CONVERSION GATE',tagClass:'open',action:'Scale gate: automation, cadence and service-level delivery must be secured.'},
 satellite:{title:'WREN-1: the in-orbit EO platform',border:'#4bd59b',text:'The spacecraft is the enabling asset—not the finished service. Its value chain begins with image acquisition and continues through calibration, processing, user workflow, customer validation and potentially recurring revenue.',tag:'OPERATIONAL EO DEMONSTRATOR',tagClass:'observed',action:'Choose a value lens or ground target to follow a potential conversion pathway.'}
};
let lens='capability';const card=document.getElementById('card');const dataPath=document.getElementById('dataPath');const dataDot=document.getElementById('dataDot');
function show(key){const c=content[key];card.style.borderLeftColor=c.border;card.innerHTML='<h2>'+c.title+'</h2><p>'+c.text+'</p><span class="tag '+c.tagClass+'">'+c.tag+'</span><span class="action">'+c.action+'</span>';document.querySelectorAll('.target').forEach(function(el){el.classList.toggle('active',el.dataset.target===key);});dataPath.classList.add('show');dataDot.classList.add('show');setTimeout(function(){dataPath.classList.remove('show');dataDot.classList.remove('show');},800);}
document.querySelectorAll('.tab').forEach(function(btn){btn.addEventListener('click',function(){lens=btn.dataset.lens;document.querySelectorAll('.tab').forEach(function(x){x.classList.toggle('active',x===btn);});show(lens);});});document.querySelectorAll('.target').forEach(function(btn){btn.addEventListener('click',function(){show(btn.dataset.target);});});document.getElementById('satellite').addEventListener('click',function(){show('satellite');});show('capability');
</script>
</body>
</html>
